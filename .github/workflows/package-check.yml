name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check the Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p LibStub/LibStub.lua *.lua

      # LibGlass-1.0 is embedded beside this library by each consumer, so the
      # tests load it from a checkout at the ref tests/libglass-ref.txt names.
      - name: Fetch LibGlass
        run: |
          ref=$(head -n 1 tests/libglass-ref.txt | tr -d '[:space:]')
          git clone --quiet https://github.com/Spotnick2/LibGlass "$RUNNER_TEMP/LibGlass"
          git -C "$RUNNER_TEMP/LibGlass" checkout --quiet "$ref"
          test "$(git -C "$RUNNER_TEMP/LibGlass" rev-parse HEAD)" = "$(git -C "$RUNNER_TEMP/LibGlass" rev-parse "$ref^{commit}")"
          echo "LIBGLASS=$RUNNER_TEMP/LibGlass" >> "$GITHUB_ENV"
          echo "LibGlass at $ref ($(git -C "$RUNNER_TEMP/LibGlass" rev-parse --short HEAD))"

      - name: Unit tests
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done
